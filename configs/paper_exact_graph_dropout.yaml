# Literal layer ordering from the paper: GAT -> mean pool -> dropout -> classifier.
# Attention and node-layer dropout are disabled; dropout 0.5 is applied once to the
# 128-dimensional pooled graph embedding immediately before the linear classifier.
seed: 42
data_root: data/malnet_tiny_paper_exact
output_dir: runs/paper_exact_graph_dropout
feature_profile: ldp
log_features: false
remove_isolated_nodes: false
split_strategy: paper_stratified
split_seed: 42
hidden_channels: 128
num_layers: 3
heads: 4
concat_heads: false
activation: relu
layer_norm: false
dropout: 0.50
attention_dropout: 0.0
dropout_location: graph
pooling: mean
classifier_hidden: false
batch_size: 128
epochs: 50
learning_rate: 0.005
weight_decay: 0.0
label_smoothing: 0.0
patience: 0
lr_scheduler: none
checkpoint_metric: val_accuracy
num_workers: 0
device: auto
